name: Verify ParkFlow
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkflow
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: parkflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parkflow -d parkflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://parkflow:ci-test-only@localhost:5432/parkflow_test
      TEST_DATABASE_URL: postgresql://parkflow:ci-test-only@localhost:5432/parkflow_test
      REDIS_URL: redis://localhost:6379/15
      SMS_PROVIDER: disabled
      DEV_SKIP_PHONE_OTP: 'false'
      DEV_SKIP_EMAIL_OTP: 'false'
      PAYMENT_PROVIDER: development
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-at-least-32-characters
      PROFILE_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Configure isolated test services
        run: cp server/.env.example server/.env
      - run: npm run db:generate
        working-directory: server
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: server
      - run: node --test tests/*.test.cjs
      - name: Apply every migration to the disposable test database
        run: node scripts/migrate-test.cjs
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Build web bundle
        run: npx expo export --platform web --output-dir /tmp/parkflow-web
      - run: git diff --check
